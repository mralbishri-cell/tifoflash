name: tifoflash_app
description: "Synchronized Digital Light Tifo System for Sports Stadiums."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase Realtime Sync
  firebase_core: ^3.12.0
  firebase_database: ^11.3.0

  # Hardware & Sensor APIs
  torch_light: ^1.0.0
  screen_brightness: ^2.0.0
  sensors_plus: ^6.1.1
  permission_handler: ^11.4.0
  vibration: ^2.0.1

  # State Management & Utilities
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  http: ^1.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/

