workflows:
  ios-release-workflow:
    name: TifoFlash iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: appstore_key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tifoflash.tifoflashApp
    scripts:
      - name: Fetch Flutter dependencies
        script: |
          cd tifoflash_app
          flutter pub get
      - name: Run Code Analysis & Unit Tests
        script: |
          cd tifoflash_app
          flutter analyze
          flutter test
      - name: Build Flutter iOS Release Assets
        script: |
          cd tifoflash_app
          flutter build ios --release
      - name: Package & Sign iOS IPA with Codemagic Integration Key
        script: |
          cd tifoflash_app
          xcode-project build-ipa --workspace ios/Runner.xcworkspace --scheme Runner
    artifacts:
      - tifoflash_app/build/ios/ipa/*.ipa
      - tifoflash_app/build/ios/archive/Runner.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true

  android-release-workflow:
    name: TifoFlash Android Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Fetch Flutter dependencies
        script: |
          cd tifoflash_app
          flutter pub get
      - name: Build Android APK & App Bundle (AAB)
        script: |
          cd tifoflash_app
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - tifoflash_app/build/app/outputs/flutter-apk/*.apk
      - tifoflash_app/build/app/outputs/bundle/release/*.aab
