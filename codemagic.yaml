workflows:
  flutter-mobile-workflow:
    name: TifoFlash Mobile CI/CD Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          cd tifoflash_app
          flutter pub get
      - name: Run Flutter Static Analysis & Tests
        script: |
          cd tifoflash_app
          flutter analyze
          flutter test
      - name: Build Android Release APK & App Bundle
        script: |
          cd tifoflash_app
          flutter build apk --release
          flutter build appbundle --release
      - name: Build iOS Release App (IPA)
        script: |
          cd tifoflash_app
          flutter build ipa --release --no-codesign
    artifacts:
      - tifoflash_app/build/app/outputs/flutter-apk/*.apk
      - tifoflash_app/build/app/outputs/bundle/release/*.aab
      - tifoflash_app/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
