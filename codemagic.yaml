workflows:
  ios-release-workflow:
    name: TifoFlash iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: appstore_key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fetch Flutter dependencies
        script: |
          cd tifoflash_app
          flutter pub get
      - name: Run Code Analysis & Unit Tests
        script: |
          cd tifoflash_app
          flutter analyze
          flutter test
      - name: Build & Sign IPA using Codemagic CLI and App Store Connect Key
        script: |
          cd tifoflash_app
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --app-store-connect-key-identifier X2PW7H26RA \
            --app-store-connect-issuer-id 48d62ff4-f0ef-4e40-b1c9-a3559e7bd7d1
    artifacts:
      - tifoflash_app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true

  android-release-workflow:
    name: TifoFlash Android Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Fetch Flutter dependencies
        script: |
          cd tifoflash_app
          flutter pub get
      - name: Build Android APK & App Bundle (AAB)
        script: |
          cd tifoflash_app
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - tifoflash_app/build/app/outputs/flutter-apk/*.apk
      - tifoflash_app/build/app/outputs/bundle/release/*.aab
